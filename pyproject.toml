[project]
name = "acoustic-pulse-hmm"
version = "0.1.0"
description = "Audio feature experiments with Gaussian mixtures and hidden Markov models"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
